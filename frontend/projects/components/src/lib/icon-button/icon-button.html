<button
  mat-icon-button
  class="icon-button"
  [class.icon-button--active]="active()"
  [attr.type]="type()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="active()"
  [disabled]="disabled() || loading()"
  [matTooltip]="tooltip() || label()"
  (click)="onClick($event)">
  @if (loading()) {
    <mat-progress-spinner
      class="icon-button__spinner"
      mode="indeterminate"
      diameter="20"
      aria-hidden="true" />
  } @else {
    <mat-icon class="icon-button__icon" aria-hidden="true">{{ icon() }}</mat-icon>
  }
</button>
