<mat-button-toggle-group
  class="segmented-chip-group"
  [value]="selectedOption()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (change)="onSelectionChange($event.value)">
  @for (option of options(); track option.id) {
    <mat-button-toggle
      class="segmented-chip-group__option"
      [value]="option.id"
      [disabled]="disabled() || !!option.disabled">
      @if (option.icon) {
        <mat-icon class="segmented-chip-group__icon" aria-hidden="true">{{ option.icon }}</mat-icon>
      }
      <span class="segmented-chip-group__label">{{ option.label }}</span>
    </mat-button-toggle>
  }
</mat-button-toggle-group>
