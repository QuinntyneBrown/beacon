<nav class="breadcrumb" aria-label="Breadcrumb">
  @for (item of visibleItems(); track item.id; let index = $index; let last = $last) {
    @if (isTruncated() && index === 1) {
      <span class="breadcrumb__ellipsis" aria-hidden="true">...</span>
      <mat-icon class="breadcrumb__separator" aria-hidden="true">chevron_right</mat-icon>
    }

    <button
      mat-button
      type="button"
      class="breadcrumb__item"
      [class.breadcrumb__item--active]="item.id === activeItemId() || last"
      [disabled]="!!item.disabled"
      [attr.aria-current]="item.id === activeItemId() || last ? 'page' : null"
      (click)="selectItem(item)">
      @if (item.icon) {
        <mat-icon class="breadcrumb__item-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
      }
      <span class="breadcrumb__item-label">{{ item.label }}</span>
    </button>

    @if (!last) {
      <mat-icon class="breadcrumb__separator" aria-hidden="true">chevron_right</mat-icon>
    }
  }
</nav>
