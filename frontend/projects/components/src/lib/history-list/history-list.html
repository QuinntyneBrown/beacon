@if (items().length === 0) {
  <p class="history-list__empty">{{ emptyText() }}</p>
} @else {
  <mat-list class="history-list" [class.history-list--compact]="density() === 'compact'">
    @for (item of items(); track item.id) {
      @if (item.interactive) {
        <button
          mat-list-item
          type="button"
          class="history-list__item"
          (click)="itemSelected.emit(item.id)">
          @if (item.icon) {
            <mat-icon matListItemIcon class="history-list__icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          }
          <span matListItemTitle class="history-list__title">{{ item.title }}</span>
          @if (item.description) {
            <span matListItemLine class="history-list__description">{{ item.description }}</span>
          }
          @if (item.timestamp) {
            <span matListItemMeta class="history-list__timestamp">{{ item.timestamp }}</span>
          }
        </button>
      } @else {
        <mat-list-item class="history-list__item">
          @if (item.icon) {
            <mat-icon matListItemIcon class="history-list__icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          }
          <span matListItemTitle class="history-list__title">{{ item.title }}</span>
          @if (item.description) {
            <span matListItemLine class="history-list__description">{{ item.description }}</span>
          }
          @if (item.timestamp) {
            <span matListItemMeta class="history-list__timestamp">{{ item.timestamp }}</span>
          }
        </mat-list-item>
      }
    }
  </mat-list>
}
