<nav
  class="responsive-navigation"
  [class.responsive-navigation--bottom]="mode() === 'bottom'"
  [class.responsive-navigation--rail]="mode() === 'rail'"
  [class.responsive-navigation--drawer]="mode() === 'drawer'"
  [class.responsive-navigation--collapsed]="!expanded()"
  [attr.aria-label]="ariaLabel()">
  @if (createActionLabel() && mode() !== 'bottom') {
    <button
      mat-button
      type="button"
      class="responsive-navigation__create"
      [class.responsive-navigation__create--icon-only]="mode() === 'rail' || !expanded()"
      [attr.aria-label]="createActionLabel()"
      (click)="createActionClicked.emit()">
      <mat-icon class="responsive-navigation__create-icon" aria-hidden="true">{{ createActionIcon() }}</mat-icon>
      @if (mode() === 'drawer' && expanded()) {
        <span class="responsive-navigation__create-label">{{ createActionLabel() }}</span>
      }
    </button>
  }

  @for (section of sections(); track section.label) {
    @if (section.label && mode() === 'drawer' && expanded()) {
      <span class="responsive-navigation__section-label">{{ section.label }}</span>
    }

    <div class="responsive-navigation__items">
      @for (item of section.items; track item.id) {
        <button
          mat-button
          type="button"
          class="responsive-navigation__item"
          [class.responsive-navigation__item--active]="isActive(item)"
          [disabled]="!!item.disabled"
          [attr.aria-current]="isActive(item) ? 'page' : null"
          [attr.aria-label]="item.label"
          [matBadge]="item.badgeCount ?? ''"
          [matBadgeHidden]="item.badgeCount === undefined"
          matBadgeSize="small"
          (click)="selectItem(item)">
          @if (item.icon) {
            <mat-icon class="responsive-navigation__item-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          }
          @if (mode() !== 'rail' && expanded()) {
            <span class="responsive-navigation__item-label">{{ item.label }}</span>
          }
        </button>
      }
    </div>
  }
</nav>
