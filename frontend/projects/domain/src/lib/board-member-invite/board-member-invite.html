@if (open()) {
  <section class="board-member-invite">
    <header class="board-member-invite__header">
      <div class="board-member-invite__titles">
        <h2 class="board-member-invite__title">Invite member</h2>
        <p class="board-member-invite__subtitle">Add a teammate to this board.</p>
      </div>
      <lib-avatar-stack [avatars]="currentMembers()" [maxVisibleCount]="4" size="small" />
    </header>

    <form class="board-member-invite__form" [formGroup]="inviteForm" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <input matInput formControlName="role" />
      </mat-form-field>
      @if (validationError()) {
        <p class="board-member-invite__error">{{ validationError() }}</p>
      }
      <div class="board-member-invite__actions">
        <button mat-button type="button" (click)="inviteCanceled.emit()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="!invitePermission() || submitting()">Send invite</button>
      </div>
    </form>
  </section>
}
