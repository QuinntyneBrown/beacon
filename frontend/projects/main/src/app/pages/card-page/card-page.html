<section class="card-page">
  @if (errorMessage()) {
    <lib-snackbar
      [message]="errorMessage()"
      severity="error"
      [duration]="0"
      (dismissed)="dismissMessages()" />
  }

  @if (helperMessage()) {
    <lib-snackbar
      [message]="helperMessage()"
      severity="success"
      [duration]="0"
      (dismissed)="dismissMessages()" />
  }

  @if (card(); as activeCard) {
    <lib-breadcrumb
      [items]="breadcrumbItems(activeCard)"
      [activeItemId]="activeCard.cardId"
      (itemSelected)="navigateBreadcrumb($event)" />

    <lib-page-header [title]="activeCard.title" [subtitle]="activeCard.columnName" [divided]="true">
      <div page-header-actions>
        <lib-card-workflow-actions
          [cardStatus]="metadataFor(activeCard).status"
          [watched]="watched()"
          [permissions]="cardPermissions"
          [busyActionId]="isSaving() ? 'complete' : null"
          (watchToggled)="watched.set($event)"
          (moveRequested)="showUnavailableAction('Move')"
          (markDoneRequested)="showUnavailableAction('Completion')"
          (shareRequested)="showUnavailableAction('Sharing')" />
      </div>
    </lib-page-header>

    <div class="card-page__layout">
      <main class="card-page__main">
        <lib-section-block heading="Details">
          <div class="card-page__details-form">
            <lib-outlined-text-field
              label="Title"
              [value]="editForm.controls.title.value"
              [required]="true"
              [errors]="titleErrors()"
              [disabled]="isSaving()"
              (valueChanged)="updateEditField('title', $event)"
              (blurred)="markEditFieldTouched('title')"
              (submitted)="save()" />

            <lib-outlined-text-field
              label="Description"
              [multiline]="true"
              [rows]="4"
              [value]="editForm.controls.description.value"
              [disabled]="isSaving()"
              (valueChanged)="updateEditField('description', $event)"
              (blurred)="markEditFieldTouched('description')"
              (submitted)="save()" />

            <div class="card-page__actions">
              <lib-button
                label="Save changes"
                icon="save"
                [loading]="isSaving()"
                [disabled]="editForm.invalid || isSaving()"
                (clicked)="save()" />
            </div>
          </div>
        </lib-section-block>

        <lib-section-block heading="Labels">
          <lib-card-label-list [labels]="cardLabels" [editable]="cardPermissions.canEdit ?? false" />
        </lib-section-block>

        <lib-section-block heading="Checklist">
          <lib-card-checklist
            [checklistItems]="activeCard.checklistItems"
            [editable]="cardPermissions.canEdit ?? false"
            [busyItemIds]="busyChecklistItemIds()"
            (itemAdded)="addChecklistItemText($event)"
            (itemToggled)="toggleChecklistItem($event.itemId, $event.completed)" />
        </lib-section-block>

        <lib-section-block heading="Activity">
          <lib-card-activity-thread
            [activityItems]="activityItemsFor(activeCard)"
            [comments]="activeCard.comments"
            [currentUser]="currentUser()"
            [permissions]="cardPermissions"
            [submitting]="commentSubmitting()"
            (commentSubmitted)="addCommentText($event)" />
        </lib-section-block>
      </main>

      <aside class="card-page__side">
        <lib-card-meta-panel
          [metadata]="metadataFor(activeCard)"
          [permissions]="cardPermissions" />

        <lib-section-block heading="Attachments" density="compact">
          <lib-card-attachment-list
            [attachments]="cardAttachments"
            [permissions]="cardPermissions" />
        </lib-section-block>
      </aside>
    </div>
  } @else {
    <lib-section-block heading="Card">Loading card...</lib-section-block>
  }
</section>
