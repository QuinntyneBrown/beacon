<section class="board-page">
  @if (board(); as activeBoard) {
    <lib-board-header
      [board]="{
        boardId: activeBoard.boardId,
        name: activeBoard.name,
        sprintText: activeBoard.columns.length + ' columns tuned for focused delivery',
        statusText: 'Active',
        members: members
      }" />

    <lib-board-view-controls activeView="board" [filterCount]="0" />

    <lib-card-quick-create-action
      [boardId]="activeBoard.boardId"
      [canCreate]="true"
      [hidden]="false" />
  }

  @if (errorMessage()) {
    <lib-snackbar [message]="errorMessage()" severity="error" [duration]="0" />
  }

  <lib-kanban-board />
</section>
