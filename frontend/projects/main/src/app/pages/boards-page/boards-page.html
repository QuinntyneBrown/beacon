<section class="boards-page">
  <lib-boards-dashboard-view
    [currentUser]="session() ? { displayName: session()!.displayName, email: session()!.email, roles: session()!.roles } : null"
    [boards]="boardTiles()"
    [starredBoards]="starredBoardTiles()"
    [selectedFilterId]="'all'"
    [searchQuery]="searchTerm()"
    [loading]="isLoading()"
    [errorMessage]="errorMessage()"
    [canCreateBoard]="!creating()"
    (searchSubmitted)="searchTerm.set($event)"
    (boardSelected)="openBoard($event)"
    (createRequested)="createForm.controls.name.markAsTouched()"
    (boardActionSelected)="handleBoardAction($event)" />

  <form class="boards-page__create-form" [formGroup]="createForm" (ngSubmit)="create()">
    <lib-outlined-text-field
      label="New board name"
      placeholder="e.g. Q3 Roadmap"
      [value]="createForm.controls.name.value"
      [errors]="createForm.controls.name.touched && createForm.controls.name.invalid ? ['Board name is required.'] : []"
      [disabled]="creating()"
      (valueChanged)="updateCreateName($event)"
      (submitted)="create()" />
    <lib-button
      label="Create board"
      icon="add"
      type="button"
      [loading]="creating()"
      [disabled]="creating()"
      (clicked)="create()" />
  </form>
</section>
