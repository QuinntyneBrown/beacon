@if (session(); as activeSession) {
  <lib-app-shell
    [navigationItems]="navigationItems"
    [activeItemId]="activeNavigationId()"
    [createActionLabel]="createActionLabel()"
    (navigationItemSelected)="navigateTo($event)"
    (createActionClicked)="handleCreateAction()">
    <lib-top-app-bar
      app-shell-top-bar
      title="Beacon"
      brand="Beacon"
      leadingIcon="menu"
      [avatarLabel]="activeSession.displayName"
      [avatarInitials]="activeSession.displayName.slice(0, 2)">
      <div top-app-bar-actions class="app__top-actions">
        <span class="app__user-name">{{ activeSession.displayName }}</span>
        <lib-button label="Sign out" variant="outlined" (clicked)="signOut()" />
      </div>
    </lib-top-app-bar>

    <router-outlet />
  </lib-app-shell>
} @else {
  <router-outlet />
}
